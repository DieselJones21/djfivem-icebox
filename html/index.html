<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rebel Roleplay Icebox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=atelier2" />
</head>
<body>
  <div id="app" class="hidden" data-view="showroom">
    <aside class="rail">
      <div class="brand">
        <img src="assets/rebel-logo.png" alt="Rebel Roleplay" class="wordmark" />
        <p class="eyebrow">Rebel Roleplay</p>
        <h1>Icebox</h1>
        <p class="tagline">Fine jewelry · Los Santos</p>
      </div>
      <nav id="nav">
        <button class="nav-btn active" data-view="showroom">
          <span>The Case</span>
          <small>Ready to wear</small>
        </button>
        <button class="nav-btn" data-view="workshop" data-employee="true">
          <span>Atelier</span>
          <small>Orders &amp; bench</small>
        </button>
        <button class="nav-btn" data-view="supplier" data-supplier="true">
          <span>Metals</span>
          <small>Wholesale stock</small>
        </button>
        <button class="nav-btn" data-view="owned">
          <span>My Collection</span>
          <small>Wear &amp; manage</small>
        </button>
        <button class="nav-btn" data-view="fence" data-fence="true">
          <span>Private Buyer</span>
          <small>Snatched only</small>
        </button>
      </nav>
      <div class="equipped" id="equipped">
        <p class="eyebrow">On you</p>
        <div class="equipped-row" data-slot="chain">No chain</div>
        <div class="equipped-row" data-slot="watch">No watch</div>
      </div>
      <div class="job-pill" id="jobPill">Guest</div>
    </aside>

    <main class="stage">
      <header class="top">
        <div>
          <p class="eyebrow" id="viewEyebrow">The Case</p>
          <h2 id="viewTitle">The collection</h2>
        </div>
        <div class="top-actions">
          <div class="filters" id="filters"></div>
          <button class="close-btn" id="closeBtn" type="button">Close</button>
        </div>
      </header>

      <section class="orders hidden" id="orders"></section>

      <section class="grid-wrap">
        <div class="cards" id="cards"></div>
        <article class="detail" id="detail">
          <div class="preview" id="preview">
            <img class="preview-img hidden" id="previewImg" alt="" />
            <div class="chain-glyph" id="glyph">◇</div>
          </div>
          <p class="rarity" id="detailRarity">Select</p>
          <h3 id="detailTitle">A piece from the case</h3>
          <p class="copy" id="detailCopy">Every Icebox chain is cut, set, and serialized in-house for Rebel Roleplay.</p>
          <ul class="meta" id="detailMeta"></ul>
          <div class="price-row">
            <span class="price" id="detailPrice">$0</span>
            <span class="price-note" id="detailNote"></span>
          </div>
          <div class="actions" id="detailActions"></div>
        </article>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js?v=atelier2"></script>
</body>
</html>
